name: Docker Compose Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          echo "Building Docker images..."
          docker compose build 2>&1
          if [ $? -ne 0 ]; then
            echo "❌ Docker build failed"
            exit 1
          fi
          echo "✓ Docker images built successfully"

      - name: Start services
        run: |
          echo "Starting Docker services..."
          docker compose up -d 2>&1
          sleep 3
          echo "Services status after startup:"
          docker compose ps

      - name: Check backend container logs immediately
        if: always()
        run: |
          echo "=== Backend container logs (first 30 lines) ==="
          docker compose logs backend | head -30
          echo ""
          echo "=== Checking backend container state ==="
          docker compose ps backend
          echo ""
          echo "=== Checking if backend container is still running ==="
          docker compose exec -T backend echo "Backend container is accessible" || echo "❌ Backend container is not responding"

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            # Check if both services are running and healthy
            backend_status=$(docker compose ps backend --format json | jq -r '.[0].State' 2>/dev/null || echo "")
            frontend_status=$(docker compose ps frontend --format json | jq -r '.[0].State' 2>/dev/null || echo "")
            
            if [ "$backend_status" = "running" ] && [ "$frontend_status" = "running" ]; then
              echo "✓ Both services are running"
              break
            fi
            
            echo "Waiting... (attempt $((attempt+1))/$max_attempts) - Backend: $backend_status, Frontend: $frontend_status"
            sleep 2
            attempt=$((attempt+1))
          done
          
          # Show service status for debugging
          echo "Service status:"
          docker compose ps
          
          if [ "$attempt" -eq "$max_attempts" ]; then
            echo "❌ Services did not start within timeout"
            echo "=== Full backend logs ==="
            docker compose logs backend
            exit 1
          fi

      - name: Test backend health endpoint
        run: |
          echo "Testing backend health endpoint..."
          
          # Try direct curl first
          echo "Attempting curl from host..."
          curl -v http://localhost:8000/health 2>&1 || echo "Direct curl from host failed"
          
          echo ""
          echo "Attempting curl from backend container..."
          if docker compose exec -T backend curl -v http://localhost:8000/health; then
            echo "✓ Backend health check successful"
          else
            echo "❌ Backend health check failed"
            echo "=== Full backend container logs ==="
            docker compose logs backend
            exit 1
          fi

      - name: Verify Python imports in backend
        run: |
          echo "Checking Python imports..."
          docker compose exec -T backend python -c "
          try:
              from src.main import app
              print('✓ main.py imports successfully')
          except Exception as e:
              print(f'❌ Import error: {e}')
              import traceback
              traceback.print_exc()
              exit(1)
          " || echo "❌ Python import verification failed"

      - name: Test frontend container is reachable
        run: |
          echo "Testing frontend container reachability..."
          docker compose exec -T backend curl -f -s http://frontend:5173/ > /dev/null 2>&1 || echo "⚠ Frontend not fully ready yet (normal during startup)"
          echo "✓ Frontend container network accessible"

      - name: Test backend health endpoint from frontend
        run: |
          echo "Testing backend health endpoint from frontend container..."
          if response=$(docker compose exec -T frontend curl -f -s http://backend:8000/health 2>&1); then
            status=$(echo "$response" | jq -r '.status' 2>/dev/null)
            if [ "$status" = "healthy" ]; then
              echo "✓ Backend is reachable and healthy from frontend"
            else
              echo "⚠ Backend responded but status is: $status"
              echo "Full response: $response"
            fi
          else
            echo "⚠ Frontend could not reach backend (may be normal timing issue)"
          fi

      - name: Show detailed service logs on any failure
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose logs --tail=100
          
          echo ""
          echo "=== Backend Environment Variables ==="
          docker compose exec -T backend env | grep -E "API_|CORS|ENVIRONMENT" || true
          
          echo ""
          echo "=== Backend Process Check ==="
          docker compose exec -T backend ps aux | grep -E "python|uvicorn" || true
          
          echo ""
          echo "=== Port Status ==="
          docker compose exec -T backend netstat -tlnp 2>/dev/null | grep 8000 || echo "Port 8000 status unavailable"

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          docker compose down -v
          echo "✓ Cleanup complete"
