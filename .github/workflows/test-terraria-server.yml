name: Test Terraria Server Creation

on:
  workflow_dispatch:

jobs:
  test-terraria-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Create terraria config directory
        run: mkdir -p /tmp/pylon/servers

      - name: Start Docker daemon
        run: sudo service docker start

      - name: Start FastAPI backend in background
        working-directory: ./backend
        env:
          API_TITLE: Pylon
          API_VERSION: 0.1.0
          API_HOST: 0.0.0.0
          API_PORT: 8000
          CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
          ENVIRONMENT: test
          TERRARIA_CONFIG_PATH: /tmp/pylon/servers/
        run: |
          python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          sleep 2
        shell: bash

      - name: Wait for backend healthcheck
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              echo "✓ Backend is healthy"
              exit 0
            fi
            echo "[$i/30] Waiting for backend healthcheck..."
            sleep 1
          done
          echo "✗ Backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Run Terraria server creation test
        working-directory: ./backend
        env:
          PYTHONPATH: ./src
        run: |
          pytest -v tests/test_terraria_integration.py::test_create_and_verify_terraria_server \
            -s --tb=short

      - name: Cleanup - Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) 2>/dev/null || true
          fi
          pkill -f "uvicorn" || true
          sleep 1
          echo "✓ Backend stopped"

      - name: Show backend logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          cat /tmp/backend.log 2>/dev/null || echo "No logs found"
